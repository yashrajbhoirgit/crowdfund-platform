# Server configuration
server.port=${PORT:8080}

# DataSource configuration (Auto-detects H2 embedded database or external MySQL if URL provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/crowdfund_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:crowdfundSecretKey2024SuperSecureKey}
app.jwt.expiration=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay Configuration (Official Sandbox / Test Keys)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TfsjLwk2xV57fY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:omQE9VOrrhNScS2e0pfAzZtH}
