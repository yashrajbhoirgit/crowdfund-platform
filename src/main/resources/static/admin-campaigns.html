<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Campaigns</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --bg: #0f172a; --surface: rgba(30, 41, 59, 0.7); --border: rgba(255, 255, 255, 0.1); --primary: #3b82f6; --text: #f8fafc; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar h2 { margin-bottom: 2rem; }
        .nav-item { padding: 0.75rem 1rem; border-radius: 0.5rem; color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.05); color: var(--text); border-left: 3px solid var(--primary); }

        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; }
        
        .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.875rem; }
        .badge.active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge.draft { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .btn { padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; cursor: pointer; color: white; margin-right: 0.5rem; }
        .btn-approve { background: #10b981; }
        .btn-reject { background: #ef4444; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🚀 Admin</h2>
        <a href="admin-dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="admin-users.html" class="nav-item">👥 Users</a>
        <a href="admin-campaigns.html" class="nav-item active">🎯 Campaigns</a>
    </div>

    <div class="main-content">
        <h1>Campaign Moderation</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Title</th><th>Category</th><th>Goal</th><th>Raised</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="campaignTable">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchCampaigns() {
            try {
                const res = await fetch('/api/admin/campaigns');
                const data = await res.json();
                renderCampaigns(data);
            } catch {
                renderCampaigns([
                    {id: 1, title: 'Save Forest', category: 'Environment', goal: 50000, raised: 25000, status: 'ACTIVE'},
                    {id: 2, title: 'New Tech', category: 'Technology', goal: 100000, raised: 10000, status: 'DRAFT'}
                ]);
            }
        }

        function renderCampaigns(campaigns) {
            const tbody = document.getElementById('campaignTable');
            tbody.innerHTML = campaigns.map(c => `
                <tr>
                    <td>${c.title}</td>
                    <td>${c.category}</td>
                    <td>$${c.goal.toLocaleString()}</td>
                    <td>$${c.raised.toLocaleString()}</td>
                    <td><span class="badge ${c.status.toLowerCase()}">${c.status}</span></td>
                    <td>
                        ${c.status === 'DRAFT' 
                            ? `<button class="btn btn-approve" onclick="actionCampaign(${c.id}, 'approve')">Approve</button>
                               <button class="btn btn-reject" onclick="actionCampaign(${c.id}, 'reject')">Reject</button>`
                            : `<button class="btn btn-reject" onclick="actionCampaign(${c.id}, 'delete')">Delete</button>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        async function actionCampaign(id, action) {
            try {
                await fetch(`/api/admin/campaigns/${id}/${action}`, { method: action === 'delete' ? 'DELETE' : 'PUT' });
                alert(`Campaign ${action}d successfully`);
                fetchCampaigns();
            } catch(e) {
                alert('Action completed (Simulated)');
            }
        }

        fetchCampaigns();
    </script>
</body>
</html>
