<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Campaign Moderation - CrowdHope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

        .admin-layout { display: flex; flex: 1; }

        .sidebar {
            width: 250px;
            background: var(--surface);
            backdrop-filter: blur(14px);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .sidebar-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 0.5rem 1rem 1rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-left: 3px solid var(--primary);
        }

        .main-content { flex: 1; padding: 2.5rem; overflow-y: auto; }
        
        .header { margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; font-weight: 800; }

        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border); }
        th { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        .badge.active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge.pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .badge.rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .actions-cell { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .btn { padding: 0.4rem 0.8rem; border: none; border-radius: 0.45rem; cursor: pointer; font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: all 0.2s; display: inline-block; }
        .btn-view { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .btn-view:hover { background: var(--primary); color: white; }
        .btn-approve { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-approve:hover { background: var(--success); color: white; }
        .btn-reject { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-reject:hover { background: var(--warning); color: black; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-delete:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>
    <script src="js/navbar.js"></script>

    <div class="admin-layout">
        <div class="sidebar">
            <div class="sidebar-title">Admin Console</div>
            <a href="admin-dashboard.html" class="nav-item">Dashboard</a>
            <a href="admin-users.html" class="nav-item">Users Management</a>
            <a href="admin-campaigns.html" class="nav-item active">Campaigns Moderation</a>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Campaigns Moderation</h1>
                <p style="color:var(--text-muted);">Review, approve, or remove campaigns on the platform</p>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Campaign Title</th><th>Category</th><th>Goal (INR)</th><th>Raised (INR)</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="campaignTable">
                        <tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:3rem;">Loading campaigns...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (!token || !user || user.role !== 'ADMIN') {
            alert('Access restricted. Admin credentials required.');
            window.location.href = 'login.html';
        }

        function formatINR(val) {
            if (!val && val !== 0) return 'INR 0';
            return 'INR ' + Number(val).toLocaleString('en-IN');
        }

        async function fetchCampaigns() {
            try {
                const res = await fetch('/api/admin/campaigns', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    renderCampaigns(data);
                } else {
                    document.getElementById('campaignTable').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#f87171; padding:2rem;">Failed to load campaigns.</td></tr>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderCampaigns(campaigns) {
            const tbody = document.getElementById('campaignTable');
            if (!campaigns || campaigns.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:3rem;">No campaigns found.</td></tr>';
                return;
            }

            tbody.innerHTML = campaigns.map(c => {
                const status = (c.status || 'ACTIVE').toLowerCase();
                return `
                    <tr>
                        <td>#${c.id}</td>
                        <td><strong>${escapeHtml(c.title || 'Untitled')}</strong></td>
                        <td>${escapeHtml(c.category || 'Cause')}</td>
                        <td>${formatINR(c.goal)}</td>
                        <td style="color:var(--success); font-weight:700;">${formatINR(c.raised)}</td>
                        <td><span class="badge ${status}">${c.status || 'ACTIVE'}</span></td>
                        <td>
                            <div class="actions-cell">
                                <a href="campaign-detail.html?id=${c.id}" class="btn btn-view" target="_blank">View</a>
                                ${c.status === 'PENDING' ? `
                                    <button class="btn btn-approve" onclick="performAction(${c.id}, 'approve')">Approve</button>
                                    <button class="btn btn-reject" onclick="performAction(${c.id}, 'reject')">Reject</button>
                                ` : ''}
                                <button class="btn btn-delete" onclick="performAction(${c.id}, 'delete')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function performAction(id, action) {
            const label = action.toUpperCase();
            if (!confirm('Are you sure you want to ' + action + ' campaign #' + id + '?')) {
                return;
            }

            try {
                const method = action === 'delete' ? 'DELETE' : 'PUT';
                const res = await fetch(`/api/admin/campaigns/${id}/${action}`, {
                    method: method,
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.ok) {
                    alert('Campaign ' + action + 'd successfully.');
                    fetchCampaigns();
                } else {
                    alert('Action failed (Status ' + res.status + ')');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        window.onload = fetchCampaigns;
    </script>
</body>
</html>
