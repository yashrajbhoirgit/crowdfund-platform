<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Users</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --bg: #0f172a; --surface: rgba(30, 41, 59, 0.7); --border: rgba(255, 255, 255, 0.1); --primary: #3b82f6; --text: #f8fafc; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar h2 { margin-bottom: 2rem; }
        .nav-item { padding: 0.75rem 1rem; border-radius: 0.5rem; color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.05); color: var(--text); border-left: 3px solid var(--primary); }

        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; }
        
        .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.875rem; }
        .badge.active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge.suspended { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .btn { padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; cursor: pointer; color: white; margin-right: 0.5rem; }
        .btn-suspend { background: #ef4444; }
        .btn-activate { background: #10b981; }
        .btn-export { background: var(--primary); margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🚀 Admin</h2>
        <a href="admin-dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="admin-users.html" class="nav-item active">👥 Users</a>
        <a href="admin-campaigns.html" class="nav-item">🎯 Campaigns</a>
    </div>

    <div class="main-content">
        <h1>User Management</h1>
        <div class="table-container">
            <button class="btn btn-export" onclick="exportCsv()">Export CSV</button>
            <table>
                <thead>
                    <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="userTable">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                renderUsers(data);
            } catch {
                renderUsers([
                    {id: 1, name: 'Admin', email: 'admin@test.com', role: 'ADMIN', status: 'ACTIVE'},
                    {id: 2, name: 'John Doe', email: 'john@test.com', role: 'USER', status: 'SUSPENDED'}
                ]);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td><span class="badge ${u.status.toLowerCase()}">${u.status}</span></td>
                    <td>
                        ${u.status === 'ACTIVE' 
                            ? `<button class="btn btn-suspend" onclick="toggleStatus(${u.id}, 'suspend')">Suspend</button>`
                            : `<button class="btn btn-activate" onclick="toggleStatus(${u.id}, 'activate')">Activate</button>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        async function toggleStatus(id, action) {
            try {
                await fetch(`/api/admin/users/${id}/${action}`, { method: 'PUT' });
                alert(`User ${action}d successfully`);
                fetchUsers();
            } catch(e) {
                alert('Action completed (Simulated)');
            }
        }

        function exportCsv() {
            window.open('/api/admin/reports/users/csv', '_blank');
        }

        fetchUsers();
    </script>
</body>
</html>
