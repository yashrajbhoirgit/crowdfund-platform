<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Campaigns - CrowdHope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255,255,255,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        
        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 1.1rem; }

        .search-bar { display: flex; gap: 0.75rem; max-width: 600px; margin: 0 auto 2rem; }
        .search-bar input { flex: 1; padding: 0.85rem 1.5rem; border-radius: 99px; background: var(--surface-color); border: 1px solid var(--border); color: white; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        .search-bar input:focus { border-color: var(--primary); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 0.85rem 1.75rem; border-radius: 99px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .categories { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2.5rem; }
        .category-tab { padding: 0.45rem 1.25rem; background: var(--surface-color); border: 1px solid var(--border); border-radius: 99px; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.25s; }
        .category-tab.active, .category-tab:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .campaign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2rem; }
        
        .card { background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: 1rem; border: 1px solid var(--border); overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #1e293b; display: block; }
        .card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .badge { display: inline-block; padding: 0.2rem 0.75rem; border-radius: 99px; font-size: 0.78rem; font-weight: 600; margin-bottom: 0.85rem; background: rgba(59, 130, 246, 0.2); color: #60a5fa; align-self: flex-start; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; color: white; text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-title:hover { color: #60a5fa; }
        .card-desc { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.25rem; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .progress-container { margin-bottom: 1.25rem; }
        .progress-bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem; }
        .progress-bar-fill { background: var(--accent); height: 100%; width: 0; transition: width 1s ease-in-out; }
        .stats-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
        .stats-val { color: white; font-weight: 700; font-size: 0.95rem; }

        .card-actions { display: flex; gap: 0.5rem; margin-top: auto; }
        .btn-support { flex: 1; padding: 0.75rem 1rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; text-align: center; text-decoration: none; font-size: 0.9rem; transition: all 0.2s; }
        .btn-support:hover { background: var(--primary-hover); }
        .btn-card-edit { padding: 0.75rem 0.85rem; background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-card-edit:hover { background: rgba(59, 130, 246, 0.3); border-color: rgba(59, 130, 246, 0.6); color: white; }
        .btn-card-delete { padding: 0.75rem 0.85rem; background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 0.5rem; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-card-delete:hover { background: rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.6); color: white; }
        
        .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); grid-column: 1 / -1; }
        .empty-state h3 { font-size: 1.5rem; color: var(--text-main); margin-bottom: 0.5rem; }

        .skeleton { animation: pulse 1.5s infinite; background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%); background-size: 200% 100%; }
        @keyframes pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Edit Modal Styles */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 1.5rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #1e293b; border: 1px solid var(--border); border-radius: 1.25rem;
            max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); position: relative;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { font-size: 1.4rem; font-weight: 700; color: white; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; padding: 0.25rem; line-height: 1; }
        .modal-close:hover { color: white; }
        .modal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border); border-radius: 0.6rem; color: white; font-size: 0.95rem;
            font-family: inherit; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
        .btn-save-modal {
            width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white; border: none; border-radius: 0.6rem; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s; margin-top: 0.5rem;
        }
        .btn-save-modal:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35); }
        .modal-alert { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.88rem; display: none; }
        .modal-alert.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .modal-alert.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #86efac; }
    </style>
</head>
<body>
    <script src="js/navbar.js"></script>

    <div class="container">
        <div class="header">
            <h1>Discover Campaigns</h1>
            <p>Support meaningful causes or create your own campaign</p>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search campaigns by title..." onkeypress="if(event.key==='Enter') searchCampaigns()">
            <button class="btn-primary" onclick="searchCampaigns()">Search</button>
        </div>

        <div class="categories" id="categoryTabs">
            <div class="category-tab active" onclick="loadCampaigns(this)">All</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Education', this)">Education</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Health', this)">Health</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Environment', this)">Environment</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Disaster Relief', this)">Disaster Relief</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Community', this)">Community</div>
        </div>

        <div class="campaign-grid" id="campaignGrid">
            <!-- Loading Skeletons -->
            <div class="card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton" style="height:18px; width:30%; margin-bottom:1rem; border-radius:4px;"></div><div class="skeleton" style="height:24px; margin-bottom:0.5rem; border-radius:4px;"></div><div class="skeleton" style="height:50px; margin-bottom:1.5rem; border-radius:4px;"></div></div></div>
            <div class="card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton" style="height:18px; width:30%; margin-bottom:1rem; border-radius:4px;"></div><div class="skeleton" style="height:24px; margin-bottom:0.5rem; border-radius:4px;"></div><div class="skeleton" style="height:50px; margin-bottom:1.5rem; border-radius:4px;"></div></div></div>
            <div class="card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton" style="height:18px; width:30%; margin-bottom:1rem; border-radius:4px;"></div><div class="skeleton" style="height:24px; margin-bottom:0.5rem; border-radius:4px;"></div><div class="skeleton" style="height:50px; margin-bottom:1.5rem; border-radius:4px;"></div></div></div>
        </div>
    </div>

    <!-- Edit Campaign Modal -->
    <div class="modal-overlay" id="editModalOverlay" onclick="if(event.target===this) closeEditModal()">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">✏️ Update Campaign Details</div>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            
            <div class="modal-alert" id="modalAlert"></div>

            <form id="editCampaignForm" onsubmit="handleEditFormSubmit(event)">
                <input type="hidden" id="editCampaignId">
                <div class="modal-form-grid">
                    <div class="form-group full">
                        <label for="editTitle">Campaign Title *</label>
                        <input type="text" id="editTitle" required maxlength="150">
                    </div>

                    <div class="form-group">
                        <label for="editCategory">Category *</label>
                        <select id="editCategory" required>
                            <option value="Education">Education</option>
                            <option value="Health">Health &amp; Medical</option>
                            <option value="Environment">Environment &amp; Nature</option>
                            <option value="Disaster Relief">Disaster Relief</option>
                            <option value="Community">Community Development</option>
                            <option value="Animals">Animal Welfare</option>
                            <option value="Technology">Technology &amp; Innovation</option>
                            <option value="Other">Other Causes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editGoalAmount">Target Goal Amount (INR) *</label>
                        <input type="number" id="editGoalAmount" min="100" step="10" required>
                    </div>

                    <div class="form-group full" style="background: rgba(59, 130, 246, 0.08); padding: 0.75rem; border-radius: 0.6rem; border: 1px solid rgba(59, 130, 246, 0.25);">
                        <label for="editDeadline" style="color: #60a5fa; font-weight: 700;">📅 Campaign End Date / Deadline *</label>
                        <input type="date" id="editDeadline" required style="border-color: rgba(59, 130, 246, 0.4);">
                        <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem;">Change or extend the deadline for this fundraising campaign.</div>
                    </div>

                    <div class="form-group full">
                        <label for="editShortDescription">Short Summary *</label>
                        <input type="text" id="editShortDescription" required maxlength="250">
                    </div>

                    <div class="form-group full">
                        <label for="editDescription">Full Story &amp; Details *</label>
                        <textarea id="editDescription" rows="4" required></textarea>
                    </div>

                    <div class="form-group full">
                        <label for="editImageFile">Update Cover Photo (Optional)</label>
                        <input type="file" id="editImageFile" accept="image/*">
                    </div>
                </div>

                <button type="submit" class="btn-save-modal" id="modalSaveBtn">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
        let currentCampaignsCache = [];

        function formatINR(val) {
            if (!val && val !== 0) return 'INR 0';
            return 'INR ' + Number(val).toLocaleString('en-IN');
        }

        async function fetchAPI(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Status ' + res.status);
                return await res.json();
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        function renderCampaigns(campaigns) {
            const grid = document.getElementById('campaignGrid');
            grid.innerHTML = '';
            
            const list = Array.isArray(campaigns) ? campaigns : (campaigns && campaigns.content ? campaigns.content : []);
            currentCampaignsCache = list;

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No campaigns found</h3>
                        <p>Be the first one to start a campaign!</p>
                        <a href="create-campaign.html" class="btn-primary" style="display:inline-block; text-decoration:none; margin-top:1.5rem;">Start Campaign</a>
                    </div>
                `;
                return;
            }
            
            list.forEach(c => {
                const percentage = c.progressPercentage || 0;
                const daysLeft = c.deadline ? Math.max(0, Math.ceil((new Date(c.deadline) - new Date()) / (1000 * 60 * 60 * 24))) : 0;
                const imageUrl = c.imageUrl || 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600&auto=format&fit=crop&q=80';
                
                const isOwnerOrAdmin = currentUser && (currentUser.userId == c.ownerId || currentUser.role === 'ADMIN');
                const actionsHtml = isOwnerOrAdmin ? `
                    <button onclick="openEditModal(${c.id})" class="btn-card-edit" title="Update campaign and change date">Edit</button>
                    <button onclick="deleteCardCampaign(${c.id}, '${escapeHtml(c.title || 'Campaign')}')" class="btn-card-delete" title="Delete this campaign">Delete</button>
                ` : '';

                grid.innerHTML += `
                    <div class="card" id="campaign-card-${c.id}">
                        <img src="${imageUrl}" alt="Campaign" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600&auto=format&fit=crop&q=80'">
                        <div class="card-body">
                            <span class="badge">${escapeHtml(c.category || 'Cause')}</span>
                            <a href="campaign-detail.html?id=${c.id}" class="card-title">${escapeHtml(c.title || 'Untitled')}</a>
                            <p class="card-desc">${escapeHtml(c.shortDescription || c.description || 'No description.')}</p>
                            
                            <div class="progress-container">
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                                </div>
                                <div class="stats-row">
                                    <div><span class="stats-val">${formatINR(c.raisedAmount)}</span> raised</div>
                                    <div><span class="stats-val">${percentage}%</span></div>
                                </div>
                                <div class="stats-row" style="margin-top:0.4rem; font-size:0.8rem;">
                                    <div>Goal: ${formatINR(c.goalAmount)}</div>
                                    <div>${daysLeft > 0 ? daysLeft + ' days left' : 'Ended'}</div>
                                </div>
                            </div>

                            <div class="card-actions">
                                <a href="campaign-detail.html?id=${c.id}" class="btn-support">View &amp; Support</a>
                                ${actionsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        async function openEditModal(id) {
            if (!token) {
                alert('Please sign in to update this campaign.');
                window.location.href = 'login.html';
                return;
            }

            let c = currentCampaignsCache.find(item => item.id === id);
            if (!c) {
                try {
                    const res = await fetch('/api/campaigns/' + id);
                    if (res.ok) c = await res.json();
                } catch (e) {
                    console.error(e);
                }
            }

            if (!c) {
                alert('Could not find campaign data.');
                return;
            }

            document.getElementById('editCampaignId').value = c.id;
            document.getElementById('editTitle').value = c.title || '';
            document.getElementById('editCategory').value = c.category || 'Education';
            document.getElementById('editGoalAmount').value = c.goalAmount || 1000;
            document.getElementById('editDeadline').value = c.deadline ? c.deadline.split('T')[0] : '';
            document.getElementById('editShortDescription').value = c.shortDescription || '';
            document.getElementById('editDescription').value = c.description || '';
            document.getElementById('editImageFile').value = '';

            const alertEl = document.getElementById('modalAlert');
            alertEl.style.display = 'none';

            document.getElementById('editModalOverlay').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModalOverlay').classList.remove('active');
        }

        async function handleEditFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editCampaignId').value;
            const title = document.getElementById('editTitle').value.trim();
            const category = document.getElementById('editCategory').value;
            const goalAmount = parseFloat(document.getElementById('editGoalAmount').value);
            const deadline = document.getElementById('editDeadline').value;
            const shortDescription = document.getElementById('editShortDescription').value.trim();
            const description = document.getElementById('editDescription').value.trim();
            const fileInput = document.getElementById('editImageFile');

            const alertEl = document.getElementById('modalAlert');
            const saveBtn = document.getElementById('modalSaveBtn');

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving Changes...';

            try {
                const res = await fetch('/api/campaigns/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        title,
                        category,
                        goalAmount,
                        deadline,
                        shortDescription,
                        description
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Failed to update campaign');
                }

                // If image selected, upload it
                if (fileInput.files && fileInput.files[0]) {
                    saveBtn.textContent = 'Uploading new image...';
                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    await fetch('/api/campaigns/' + id + '/upload-image', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                }

                alertEl.className = 'modal-alert success';
                alertEl.textContent = 'Campaign updated successfully!';
                alertEl.style.display = 'block';

                setTimeout(() => {
                    closeEditModal();
                    loadCampaigns();
                }, 800);

            } catch (err) {
                alertEl.className = 'modal-alert error';
                alertEl.textContent = err.message || 'Error updating campaign.';
                alertEl.style.display = 'block';
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        async function deleteCardCampaign(id, title) {
            if (!token) {
                alert('Please sign in to delete this campaign.');
                window.location.href = 'login.html';
                return;
            }

            if (!confirm('Are you sure you want to delete "' + title + '"?\n\nThis will permanently remove the campaign.')) {
                return;
            }

            try {
                const res = await fetch('/api/campaigns/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.ok || res.status === 204) {
                    alert('Campaign deleted successfully.');
                    const card = document.getElementById('campaign-card-' + id);
                    if (card) card.remove();
                } else if (res.status === 403) {
                    alert('Permission denied. You can only delete your own campaigns or as an Admin.');
                } else {
                    throw new Error('Server returned ' + res.status);
                }
            } catch (err) {
                alert('Failed to delete campaign: ' + err.message);
            }
        }

        async function loadCampaigns(el) {
            updateTabs(el || document.querySelector('.category-tab'));
            const data = await fetchAPI('/api/campaigns');
            renderCampaigns(data); 
        }

        async function loadCampaignsByCategory(category, el) {
            updateTabs(el);
            const data = await fetchAPI('/api/campaigns/category/' + encodeURIComponent(category));
            renderCampaigns(data);
        }

        async function searchCampaigns() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return loadCampaigns();
            updateTabs(null);
            const data = await fetchAPI('/api/campaigns/search?keyword=' + encodeURIComponent(keyword));
            renderCampaigns(data);
        }

        function updateTabs(activeEl) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            if (activeEl) activeEl.classList.add('active');
        }

        window.onload = function() {
            loadCampaigns();
        };
    </script>
</body>
</html>
