<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Campaigns - Crowdfund</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255,255,255,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .search-bar { display: flex; gap: 1rem; max-width: 600px; margin: 0 auto 2rem; }
        .search-bar input { flex: 1; padding: 1rem 1.5rem; border-radius: 99px; background: var(--surface-color); border: 1px solid var(--border); color: white; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        .search-bar input:focus { border-color: var(--primary); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 1rem 2rem; border-radius: 99px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .categories { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-bottom: 3rem; }
        .category-tab { padding: 0.5rem 1.5rem; background: var(--surface-color); border: 1px solid var(--border); border-radius: 99px; color: var(--text-muted); cursor: pointer; transition: all 0.3s; }
        .category-tab.active, .category-tab:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .campaign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; }
        
        .card { background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: 1rem; border: 1px solid var(--border); overflow: hidden; transition: transform 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #334155; }
        .card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .card-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: white; text-decoration: none; }
        .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; flex: 1; }
        
        .progress-container { margin-bottom: 1.5rem; }
        .progress-bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem; }
        .progress-bar-fill { background: var(--accent); height: 100%; width: 0; transition: width 1s ease-in-out; }
        .stats-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
        .stats-val { color: white; font-weight: 600; font-size: 1rem; }
        
        .skeleton { animation: pulse 1.5s infinite; background: linear-gradient(90deg, #334155 0%, #475569 50%, #334155 100%); background-size: 200% 100%; }
        @keyframes pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Discover Campaigns</h1>
            <p>Support the causes you care about</p>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search campaigns by title...">
            <button class="btn-primary" onclick="searchCampaigns()">Search</button>
        </div>

        <div class="categories" id="categoryTabs">
            <div class="category-tab active" onclick="loadCampaigns()">All</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Education', this)">Education</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Health', this)">Health</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Environment', this)">Environment</div>
            <div class="category-tab" onclick="loadCampaignsByCategory('Disaster Relief', this)">Disaster Relief</div>
        </div>

        <div class="campaign-grid" id="campaignGrid">
            <!-- Skeleton Loading -->
            <div class="card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton" style="height:20px; width:30%; margin-bottom:1rem;"></div><div class="skeleton" style="height:24px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:60px; margin-bottom:1.5rem;"></div></div></div>
            <div class="card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton" style="height:20px; width:30%; margin-bottom:1rem;"></div><div class="skeleton" style="height:24px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:60px; margin-bottom:1.5rem;"></div></div></div>
            <div class="card"><div class="card-img skeleton"></div><div class="card-body"><div class="skeleton" style="height:20px; width:30%; margin-bottom:1rem;"></div><div class="skeleton" style="height:24px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:60px; margin-bottom:1.5rem;"></div></div></div>
        </div>
    </div>

    <script>
        async function fetchAPI(url) {
            try {
                const res = await fetch(url);
                return await res.json();
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        function renderCampaigns(campaigns) {
            const grid = document.getElementById('campaignGrid');
            grid.innerHTML = '';
            if(!campaigns || campaigns.length === 0) {
                grid.innerHTML = '<p>No campaigns found.</p>';
                return;
            }
            
            campaigns.forEach(c => {
                const percentage = c.progressPercentage || 0;
                const daysLeft = c.deadline ? Math.max(0, Math.ceil((new Date(c.deadline) - new Date()) / (1000 * 60 * 60 * 24))) : 0;
                const imageUrl = c.imageUrl || 'https://via.placeholder.com/400x200/1e293b/ffffff?text=No+Image';
                
                grid.innerHTML += `
                    <div class="card">
                        <img src="${imageUrl}" alt="Campaign" class="card-img">
                        <div class="card-body">
                            <span class="badge">${c.category || 'Other'}</span>
                            <a href="campaign-detail.html?id=${c.id}" class="card-title">${c.title}</a>
                            <p class="card-desc">${c.shortDescription || c.description.substring(0, 100) + '...'}</p>
                            
                            <div class="progress-container">
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${percentage}%"></div>
                                </div>
                                <div class="stats-row">
                                    <div><span class="stats-val">$${c.raisedAmount}</span> raised</div>
                                    <div><span class="stats-val">${percentage}%</span></div>
                                </div>
                                <div class="stats-row" style="margin-top:0.5rem">
                                    <div>Goal: $${c.goalAmount}</div>
                                    <div>${daysLeft} days left</div>
                                </div>
                            </div>
                            <a href="campaign-detail.html?id=${c.id}" class="btn-primary" style="text-align:center; text-decoration:none; display:block;">Support Now</a>
                        </div>
                    </div>
                `;
            });
        }

        async function loadCampaigns() {
            updateTabs(document.querySelector('.category-tab'));
            const data = await fetchAPI('/api/campaigns');
            // Support both paginated response and list response
            renderCampaigns(data.content ? data.content : data); 
        }

        async function loadCampaignsByCategory(category, el) {
            updateTabs(el);
            const data = await fetchAPI('/api/campaigns/category/' + encodeURIComponent(category));
            renderCampaigns(data);
        }

        async function searchCampaigns() {
            const keyword = document.getElementById('searchInput').value;
            if(!keyword) return loadCampaigns();
            updateTabs(null);
            const data = await fetchAPI('/api/campaigns/search?keyword=' + encodeURIComponent(keyword));
            renderCampaigns(data);
        }

        function updateTabs(activeEl) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            if(activeEl) activeEl.classList.add('active');
        }

        window.onload = loadCampaigns;
    </script>
</body>
</html>
