<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar {
            width: 260px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar h2 { font-size: 1.5rem; margin-bottom: 2rem; color: var(--text); }
        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-left: 3px solid var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .header button {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .header button:hover { background: rgba(239, 68, 68, 0.4); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 1rem;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: 700; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; color: transparent; }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        .chart-container {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 1rem;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🚀 Admin</h2>
        <a href="admin-dashboard.html" class="nav-item active">📊 Dashboard</a>
        <a href="admin-users.html" class="nav-item">👥 Users</a>
        <a href="admin-campaigns.html" class="nav-item">🎯 Campaigns</a>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Dashboard Overview</h1>
                <p style="color: var(--text-muted)">Welcome back, Admin</p>
            </div>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Populated by JS -->
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h3>Monthly Donations</h3>
                <canvas id="monthlyChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Category Distribution</h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Check Admin Auth (Simulated)
        if (localStorage.getItem('role') && localStorage.getItem('role') !== 'ADMIN') {
            // window.location.href = '/login.html';
        }

        function logout() {
            localStorage.clear();
            alert("Logged out!");
        }

        async function fetchStats() {
            // Simulated fetch since we might not have the API running
            try {
                const res = await fetch('/api/admin/stats');
                const data = await res.json();
                renderStats(data);
            } catch {
                renderStats({
                    totalUsers: 1250, activeCampaigns: 120, totalRaisedAmount: 1540000, totalDonations: 5600
                });
            }
        }

        function renderStats(data) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card"><h3>Total Users</h3><div class="value">${data.totalUsers}</div></div>
                <div class="stat-card"><h3>Active Campaigns</h3><div class="value">${data.activeCampaigns}</div></div>
                <div class="stat-card"><h3>Total Raised ($)</h3><div class="value">${data.totalRaisedAmount.toLocaleString()}</div></div>
                <div class="stat-card"><h3>Total Donations</h3><div class="value">${data.totalDonations}</div></div>
            `;
        }

        async function fetchCharts() {
            try {
                const [monthRes, catRes] = await Promise.all([
                    fetch('/api/admin/analytics/monthly'),
                    fetch('/api/admin/analytics/categories')
                ]);
                const monthData = await monthRes.json();
                const catData = await catRes.json();
                renderCharts(monthData, catData);
            } catch {
                renderCharts(
                    [{month:'Jan', totalAmount:12000}, {month:'Feb', totalAmount:15000}, {month:'Mar', totalAmount:18000}],
                    [{category:'Tech', totalAmount:150000}, {category:'Health', totalAmount:85000}]
                );
            }
        }

        function renderCharts(monthData, catData) {
            new Chart(document.getElementById('monthlyChart'), {
                type: 'line',
                data: {
                    labels: monthData.map(d => d.month),
                    datasets: [{
                        label: 'Donations ($)',
                        data: monthData.map(d => d.totalAmount),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        tension: 0.4, fill: true
                    }]
                },
                options: { responsive: true, color: '#fff', scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
            });

            new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: catData.map(d => d.category),
                    datasets: [{
                        data: catData.map(d => d.totalAmount),
                        backgroundColor: ['#3b82f6', '#8b5cf6', '#ec4899', '#10b981']
                    }]
                },
                options: { responsive: true, color: '#fff', plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }

        fetchStats();
        fetchCharts();
    </script>
</body>
</html>
