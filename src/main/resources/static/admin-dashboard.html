<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CrowdHope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-hover: rgba(30, 41, 59, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

        .admin-layout {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            backdrop-filter: blur(14px);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 0.5rem 1rem 1rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-left: 3px solid var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .btn-action {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.35);
            color: #60a5fa;
            padding: 0.6rem 1.25rem;
            border-radius: 0.6rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-action:hover {
            background: var(--primary);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 1rem;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-card h3 { color: var(--text-muted); font-size: 0.82rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: 800; color: #ffffff; }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
            .admin-layout { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
        }

        .chart-container {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 1.75rem;
            border-radius: 1rem;
        }
        .chart-container h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    <script src="js/navbar.js"></script>

    <div class="admin-layout">
        <div class="sidebar">
            <div class="sidebar-title">Admin Console</div>
            <a href="admin-dashboard.html" class="nav-item active">Dashboard</a>
            <a href="admin-users.html" class="nav-item">Users Management</a>
            <a href="admin-campaigns.html" class="nav-item">Campaigns Moderation</a>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <h1>Platform Overview</h1>
                    <p>Live metrics and performance summary</p>
                </div>
                <div style="display:flex; gap:0.6rem;">
                    <button class="btn-action" onclick="downloadCsv('/api/admin/reports/users/csv', 'users.csv')">Export Users CSV</button>
                    <button class="btn-action" onclick="downloadCsv('/api/admin/reports/donations/csv', 'donations.csv')">Export Donations CSV</button>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><h3>Total Users</h3><div class="value" id="s-users">...</div></div>
                <div class="stat-card"><h3>Active Campaigns</h3><div class="value" id="s-active-campaigns">...</div></div>
                <div class="stat-card"><h3>Total Raised (INR)</h3><div class="value" id="s-raised" style="color:var(--success);">...</div></div>
                <div class="stat-card"><h3>Total Donations</h3><div class="value" id="s-donations">...</div></div>
            </div>

            <div class="charts-grid">
                <div class="chart-container">
                    <h3>Monthly Donations (INR)</h3>
                    <canvas id="monthlyChart" height="120"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Category Breakdown</h3>
                    <canvas id="categoryChart" height="240"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        // Check if admin
        if (!token || !user || user.role !== 'ADMIN') {
            alert('Access restricted. Admin credentials required.');
            window.location.href = 'login.html';
        }

        function formatINR(amount) {
            if (!amount && amount !== 0) return 'INR 0';
            return 'INR ' + Number(amount).toLocaleString('en-IN');
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('s-users').innerText = data.totalUsers || 0;
                    document.getElementById('s-active-campaigns').innerText = data.activeCampaigns || 0;
                    document.getElementById('s-raised').innerText = formatINR(data.totalRaisedAmount || 0);
                    document.getElementById('s-donations').innerText = data.totalDonations || 0;
                }
            } catch (err) {
                console.error("Stats error:", err);
            }
        }

        async function fetchCharts() {
            try {
                const [monthRes, catRes] = await Promise.all([
                    fetch('/api/admin/analytics/monthly', { headers: { 'Authorization': 'Bearer ' + token } }),
                    fetch('/api/admin/analytics/categories', { headers: { 'Authorization': 'Bearer ' + token } })
                ]);
                
                const monthData = monthRes.ok ? await monthRes.json() : [];
                const catData = catRes.ok ? await catRes.json() : [];
                renderCharts(monthData, catData);
            } catch (err) {
                console.error("Charts error:", err);
            }
        }

        function renderCharts(monthData, catData) {
            const ctxMonth = document.getElementById('monthlyChart').getContext('2d');
            new Chart(ctxMonth, {
                type: 'line',
                data: {
                    labels: monthData.map(d => d.month),
                    datasets: [{
                        label: 'Donation Volume (INR)',
                        data: monthData.map(d => d.totalAmount),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.15)',
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#f8fafc' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });

            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: catData.map(d => d.category),
                    datasets: [{
                        data: catData.map(d => d.totalAmount),
                        backgroundColor: ['#3b82f6', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b'],
                        borderColor: '#1e293b',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });
        }

        async function downloadCsv(url, filename) {
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Export failed');
                const blob = await res.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
            } catch (err) {
                alert('Export failed: ' + err.message);
            }
        }

        window.onload = function() {
            fetchStats();
            fetchCharts();
        };
    </script>
</body>
</html>
