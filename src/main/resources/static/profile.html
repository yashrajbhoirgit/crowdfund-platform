<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Crowdfund</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
        }

        .profile-sidebar {
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 600;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-role {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .profile-info p {
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .edit-btn {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.75rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .edit-btn:hover { background: rgba(255,255,255,0.1); }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: #94a3b8;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }

        .tab.active {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .dashboard-content {
            display: none;
        }

        .dashboard-content.active {
            display: block;
        }

        .list-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            color: white;
            outline: none;
        }
        
        .save-btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Crowdfund</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <aside class="glass-card profile-sidebar">
            <div class="avatar" id="avatarInitials">U</div>
            <h2 class="profile-name" id="display-name">Loading...</h2>
            <div class="profile-role" id="display-role">ROLE</div>
            <div class="profile-info">
                <p id="display-email"></p>
                <p id="display-location">📍 Add Location</p>
                <p id="display-bio">No bio added yet.</p>
            </div>
            <button class="edit-btn" onclick="toggleEdit()">Edit Profile</button>
        </aside>

        <main class="glass-card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('campaigns')">My Campaigns</div>
                <div class="tab" onclick="switchTab('donations')">My Donations</div>
                <div class="tab" id="settings-tab" style="display:none" onclick="switchTab('settings')">Settings</div>
            </div>

            <div id="campaigns" class="dashboard-content active">
                <h3>Your Active Campaigns</h3>
                <p style="color: #94a3b8; margin-top: 1rem;">No campaigns found.</p>
                <!-- Campaign list would be populated here via JS -->
            </div>

            <div id="donations" class="dashboard-content">
                <h3>Recent Donations</h3>
                <p style="color: #94a3b8; margin-top: 1rem;">No donations found.</p>
            </div>

            <div id="settings" class="dashboard-content">
                <h3>Edit Profile</h3>
                <form id="profileForm" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="edit-name">
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="edit-bio" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="edit-location">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="edit-phone">
                    </div>
                    <div class="form-group">
                        <label>Website</label>
                        <input type="text" id="edit-website">
                    </div>
                    <button type="submit" class="save-btn">Save Changes</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function fetchProfile() {
            try {
                const res = await fetch('/api/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const user = await res.json();
                    
                    document.getElementById('display-name').textContent = user.name;
                    document.getElementById('display-email').textContent = user.email;
                    document.getElementById('display-role').textContent = user.role.replace('_', ' ');
                    document.getElementById('display-location').textContent = user.location ? `📍 ${user.location}` : '📍 Add Location';
                    document.getElementById('display-bio').textContent = user.bio || 'No bio added yet.';
                    
                    document.getElementById('avatarInitials').textContent = user.name.charAt(0).toUpperCase();

                    document.getElementById('edit-name').value = user.name || '';
                    document.getElementById('edit-bio').value = user.bio || '';
                    document.getElementById('edit-location').value = user.location || '';
                    document.getElementById('edit-phone').value = user.phone || '';
                    document.getElementById('edit-website').value = user.website || '';
                } else {
                    logout();
                }
            } catch (err) {
                console.error('Error fetching profile', err);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.dashboard-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function toggleEdit() {
            document.getElementById('settings-tab').style.display = 'block';
            document.getElementById('settings-tab').click();
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('edit-name').value,
                bio: document.getElementById('edit-bio').value,
                location: document.getElementById('edit-location').value,
                phone: document.getElementById('edit-phone').value,
                website: document.getElementById('edit-website').value
            };

            const res = await fetch('/api/auth/profile', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Profile updated successfully!');
                fetchProfile();
                document.querySelector('.tab').click(); // go back to first tab
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        fetchProfile();
    </script>
</body>
</html>
